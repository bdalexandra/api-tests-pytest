[pytest]
# Базовые настройки
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Всегда показывать имена тестов
addopts = -v

# Таймаут для API-тестов (чтобы не висли)
timeout = 10

# Маркеры для выборочного запуска
markers =
    smoke: smoke tests (быстрая проверка основных функций)
    api: API-тесты (требуют интернет)